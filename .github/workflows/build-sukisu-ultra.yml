name: Build Kernel with SukiSU-Ultra (vayu)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y device-tree-compiler lz4 bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu

      - name: Download Clang toolchain (Proton-Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

      - name: Integrate SukiSU-Ultra (with SUSFS)
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main

      - name: Configure kernel (using system GCC)
        run: |
          make ARCH=arm64 vayu_defconfig

      - name: Build kernel image (using Clang for cross-compilation)
        run: |
          export PATH=/usr/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=$CLANG_PATH/clang
          export LD=$CLANG_PATH/ld.lld
          export AR=$CLANG_PATH/llvm-ar
          export NM=$CLANG_PATH/llvm-nm
          export OBJCOPY=$CLANG_PATH/llvm-objcopy
          make ARCH=arm64 -j$(nproc) Image.gz-dtb

      - name: Prepare AnyKernel3 package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../SukiSU-Ultra_vayu_$(date +%Y%m%d_%H%M%S).zip * -x .git README.md

      - name: Upload flashable kernel
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra_vayu_Kernel
          path: SukiSU-Ultra_vayu_*.zip
